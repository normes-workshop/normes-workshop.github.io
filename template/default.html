<!doctype html>

<html lang="{{ page.lang | default: 'en' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | escape }}{% unless page.title == site.title %} · {{ site.title | escape }}{% endunless %}</title>

    <link rel="stylesheet" href="{{ '/template/style.css' | relative_url }}">
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23284959'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='serif' font-size='24' fill='white'%3EN%3C/text%3E%3C/svg%3E">
  </head>

  <body>
    {% unless page.url == '/' %}
    <nav aria-label="Workshop series">
      <a href="{{ '/' | relative_url }}">← Workshop series</a>
    </nav>
    {% endunless %}

    <main>
      <h1>{{ page.title | escape }}</h1>
      {{ content }}
    </main>
  </body>

</html>
