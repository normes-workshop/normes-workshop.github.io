<!doctype html>
<html lang="{{ page.lang | default: 'en' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}{% unless page.title == site.title %} · {{ site.title | escape }}{% endunless %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23284959'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='serif' font-size='24' fill='white'%3EN%3C/text%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        max-width: 48rem;
        margin: 0 auto;
        padding: 3rem 1.5rem 4rem;
        background: #fcfcfa;
        color: #252b2f;
        font: 1.125rem/1.65 Georgia, "Times New Roman", serif;
        overflow-wrap: anywhere;
      }
      h1, h2, h3, nav {
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }
      h2 { margin: 2rem 0 0.75rem; font-size: 1.4rem; line-height: 1.3; }
      h3 { margin: 1.75rem 0 0.5rem; font-size: 1.15rem; line-height: 1.4; }
      p, ul, ol, blockquote { margin: 0 0 1.25rem; }
      ul, ol { padding-left: 1.5rem; }
      li + li { margin-top: 0.35rem; }
      a { color: #284959; text-underline-offset: 0.18em; }
      a:hover { text-decoration-thickness: 0.12em; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
      nav { margin-bottom: 2rem; font-size: 0.95rem; }
      figure { margin: 1.75rem 0; }
      img { display: block; max-width: 100%; height: auto; }
      figcaption { margin-top: 0.5rem; color: #555d61; font-size: 0.9rem; }
      blockquote { padding-left: 1rem; border-left: 2px solid #cbd1d3; }
      table { width: 100%; border-collapse: collapse; font-size: 1rem; }
      th, td { padding: 0.5rem; border-bottom: 1px solid #cbd1d3; text-align: left; }
      pre { overflow-x: auto; padding: 1rem; background: #f0f1ed; }
      code { font-size: 0.9em; }
      hr { margin: 2rem 0; border: 0; border-top: 1px solid #cbd1d3; }
      @media (max-width: 40rem) {
        body { padding: 2rem 1.25rem 3rem; }
      }
      @media print {
        body { max-width: none; padding: 0; background: white; color: black; }
        nav { display: none; }
      }
    </style>
  </head>
  <body>
    {% unless page.url == '/' %}
    <nav aria-label="Workshop series">
      <a href="{{ '/' | relative_url }}">← Workshop series</a>
    </nav>
    {% endunless %}
    <main>
      <h1>{{ page.title | escape }}</h1>
      {{ content }}
    </main>
  </body>
</html>
