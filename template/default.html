<!doctype html>

<html lang="{{ page.lang | default: 'en' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | escape }}{% unless page.title == site.title %} · {{ site.title | escape }}{% endunless %}</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23284959'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='serif' font-size='24' fill='white'%3EN%3C/text%3E%3C/svg%3E">

    <style>
      html {
        color-scheme: light;
      }

      body {
        max-width: 44rem;
        margin: 2.5rem auto;
        padding: 0 1rem 2rem;
        background: #fffdf3;
        color: #302e27;
        font: 1.125rem/1.6 Georgia, "Times New Roman", serif;
        overflow-wrap: anywhere;
      }

      h1, h2, h3, nav {
        font-family: "Courier New", monospace;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.2;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid;
      }

      h2 {
        margin-top: 2rem;
        font-size: 1.4rem;
      }

      h3 {
        font-size: 1.15rem;
      }

      nav {
        margin-bottom: 2rem;
        font-size: 1rem;
      }

      a { color: #17468b; }
      a:visited { color: #6b3871; }
      a:hover { background: #f0e7c8; }
      a:focus-visible { outline: 2px solid; outline-offset: 3px; }

      figure { margin: 1.5rem 0; }
      img { display: block; max-width: 100%; height: auto; }
      figcaption { margin-top: 0.4rem; font-size: 0.9rem; }

      blockquote {
        margin-left: 0;
        padding-left: 1rem;
        border-left: 3px solid #aaa38d;
      }

      table { border-collapse: collapse; }
      th, td { border: 1px solid #aaa38d; padding: 0.4rem 0.6rem; text-align: left; }

      pre { overflow-x: auto; padding: 1rem; background: #f0e7c8; }
      code { font-size: 0.9em; }
      hr { border: 0; border-top: 1px solid #aaa38d; }
    </style>
  </head>

  <body>
    {% unless page.url == '/' %}
    <nav aria-label="Workshop series">
      <a href="{{ '/' | relative_url }}">← Workshop series</a>
    </nav>
    {% endunless %}

    <main>
      <h1>{{ page.title | escape }}</h1>
      {{ content }}
    </main>
  </body>

</html>
